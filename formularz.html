<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Piotr Kiciński">
    <link rel="stylesheet" href="style.css">
    <title>Formularz poprzedzający kalkulator</title>
    <style>
        .kontener {
            text-align: center;
        }

        #formularzDanych {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 10px auto;
        }

        #formularzDanych label {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        #formularzDanych input[type="text"],
        #formularzDanych select {
            font-size: 1.2rem;
            padding: 8px 12px;
            border: 2px solid #555;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            margin: 0;
            background-color: white;
        }

        #formularzDanych input[type="submit"] {
            font-size: 1.2rem;
            padding: 12px 28px;
            border-radius: 10px;
            border: 2px solid #555;
            cursor: pointer;
            margin: 16px 0 0;
            align-self: center;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        #formularzDanych input[type="submit"]:hover {
            background-color: #28a745;
            border-color: #1e7e34;
            color: white;
        }

        footer {
            text-align: center;
        }
    </style>
</head>
<body>
<div class="kontener">
    <h1>Formularz danych</h1>

    <form id="formularzDanych" action="formularz">
        <label for="ojciec">Wypłata ojca:</label>
        <input type="text" id="ojciec" name="ojciec">

        <label for="matka">Wypłata matki:</label>
        <input type="text" id="matka" name="matka">

        <label for="zdarzenie">Stan dziecka:</label>
        <select id="zdarzenie" name="zdarzenie">
            <option value="normalne">Urodziło się zdrowe</option>
            <option value="niepelnosprawne">Urodziło się niepełnosprawne</option>
            <option value="zmarlo">Dziecko zmarło</option>
        </select>

        <input type="submit" value="Zapisz">
    </form>

    <footer>
        <p>czytaj więcej: <a href="https://www.zus.pl/">https://www.zus.pl/</a></p>
    </footer>
</div>
</body>
</html>
