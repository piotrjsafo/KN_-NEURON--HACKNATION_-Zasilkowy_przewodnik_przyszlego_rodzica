
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Piotr Kiciński">
    <link rel="stylesheet" href="style.css">
    <title>Formularz poprzedzający kalkulator</title>

    <style>
        .kontener {
            text-align: center;
        }

        #formularzDanych {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 10px auto;
        }

        #formularzDanych label {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        #formularzDanych input[type="number"],
        #formularzDanych select {
            font-size: 1.2rem;
            padding: 8px 12px;
            border: 2px solid #555;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            margin: 0;
            background-color: white;
        }

        #formularzDanych input[type="submit"] {
            font-size: 1.2rem;
            padding: 12px 28px;
            border-radius: 10px;
            border: 2px solid #555;
            cursor: pointer;
            margin: 16px 0 0;
            align-self: center;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        #formularzDanych input[type="submit"]:hover {
            background-color: #28a745;
            border-color: #1e7e34;
            color: white;
        }

        footer {
            text-align: center;
        }
    </style>
</head>

<body>
<div class="kontener">

    <h1>Formularz zasiłkowy</h1>

    <p id="powitanie"></p>

    <form id="formularzDanych" action="kalkulator.html" method="GET">

        <input type="hidden" id="ukryteImie" name="imie">
        <input type="hidden" id="ukryteNazwisko" name="nazwisko">

        <label for="matka">Wypłata matki (zł/mies.):</label>
        <input type="number" id="matka" name="matka"
               placeholder="np. 6000" min="0" required>

        <label for="ojciec">Wypłata ojca (zł/mies.):</label>
        <input type="number" id="ojciec" name="ojciec"
               placeholder="np. 7000" min="0" required>

        <label for="zdarzenie">Stan dziecka:</label>

        <select id="zdarzenie" name="zdarzenie">
            <option value="normalne">Urodziło się zdrowe</option>
            <option value="niepelnosprawne">Urodziło się niepełnosprawne</option>
            <option value="zmarlo">Dziecko zmarło</option>
        </select>

        <input type="submit" value="Zapisz i oblicz zasiłek">

    </form>

    <footer>
        <p>czytaj więcej:
            <a href="https://www.zus.pl/" target="_blank">https://www.zus.pl/</a>
        </p>
    </footer>

</div>

<script>
    // Pobranie danych z adresu strony
    const parametry = new URLSearchParams(window.location.search);

    const imie = parametry.get('imie') || '';
    const nazwisko = parametry.get('nazwisko') || '';

    // Przepisanie danych do ukrytych pól formularza
    document.getElementById('ukryteImie').value = imie;
    document.getElementById('ukryteNazwisko').value = nazwisko;

    // Wyświetlenie powitania
    document.getElementById('powitanie').textContent =
        'Witaj, ' + imie + ' ' + nazwisko + '! Wypełnij poniższe dane.';
</script>

</body>
</html>
