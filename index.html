<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="KN-NEURON, Piotr Kicinski">
    <link rel="stylesheet" href="style.css">
    <title>Świadczenie ZUS</title>

</head>
<body>
<div class="kontener">
    <h1>Zasiłkowy przewodnik przyszłego rodzica</h1>

    <div class="wybor">
        <button type="button" id="btnMObywatel">Logowanie z mObywatelem</button>
        <button type="button" id="btnBez">Logowanie bez mObywatela</button>
    </div>

    <div id="sekcjaMObywatel" style="display: none;">
        <p>Zeskanuj kod QR w aplikacji mObywatel:</p>
        <img src="kod_QR.png" alt="Kod QR">
        <p>lub kliknij przycisk poniżej, aby zasymulować autoryzację:</p>
        <button type="button" id="btnSymulujMObywatel">Autoryzuj i pobierz dane z mObywatela</button>
        <p id="statusMObywatel"></p>
    </div>

    <form id="mojFormularz" action="formularz.html" method="GET" style="display: none;">
        <input type="text" id="poleImie" name="imie" placeholder="Imię" required>
        <input type="text" id="poleNazwisko" name="nazwisko" placeholder="Nazwisko" required>
        <input type="submit" value="Zapisz i przejdź dalej">
    </form>

    <footer>
        <p>Czytaj więcej: <a href="https://zus.pl" target="_blank">https://zus.pl</a></p>
    </footer>
</div>

<script>
    const formularz = document.getElementById('mojFormularz');
const sekcjaMObywatel = document.getElementById('sekcjaMObywatel');
const btnMObywatel = document.getElementById('btnMObywatel');
const btnBez = document.getElementById('btnBez');
const btnSymuluj = document.getElementById('btnSymulujMObywatel');
const statusMObywatel = document.getElementById('statusMObywatel');
const poleImie = document.getElementById('poleImie');
const poleNazwisko = document.getElementById('poleNazwisko');

function reset() {
    formularz.style.display = 'none';
    sekcjaMObywatel.style.display = 'none';
    statusMObywatel.textContent = '';
}

function zaznacz(przycisk) {
    btnMObywatel.classList.remove('aktywny');
    btnBez.classList.remove('aktywny');
    przycisk.classList.add('aktywny');
}

btnBez.addEventListener('click', function() {
    reset();
    zaznacz(btnBez);
    poleImie.value = '';
    poleNazwisko.value = '';
    poleImie.readOnly = false;
    poleNazwisko.readOnly = false;
    formularz.style.display = 'flex';
    sessionStorage.setItem('metodaLogowania', 'reczna'); 
});

btnMObywatel.addEventListener('click', function() {
    reset();
    zaznacz(btnMObywatel);
    sekcjaMObywatel.style.display = 'block';
});

btnSymuluj.addEventListener('click', function() {
    statusMObywatel.textContent = 'Łączenie z mObywatelem...';

    setTimeout(() => {
        const daneZMobywatela = {
            imie: 'przykladowe imie',
            nazwisko: 'przykladowe nazwisko'
        };

        poleImie.value = daneZMobywatela.imie;
        poleNazwisko.value = daneZMobywatela.nazwisko;
        poleImie.readOnly = true;
        poleNazwisko.readOnly = true;
        poleImie.classList.add('ukryte');
        poleNazwisko.classList.add('ukryte');
        statusMObywatel.textContent = 'Pobrano dane pomyślnie!';
        formularz.style.display = 'flex';
        sessionStorage.setItem('metodaLogowania', 'mObywatel'); 
    }, 1000);
});

formularz.addEventListener('submit', function(e) {
    e.preventDefault(); 
    sessionStorage.setItem('imie', poleImie.value);
    sessionStorage.setItem('nazwisko', poleNazwisko.value);

    window.location.href = 'formularz.html';
});

</script>
</body>
</html>
